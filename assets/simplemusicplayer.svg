<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A88FF"/>
      <stop offset="1" stop-color="#3F2496"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E4DEFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1B0B52" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#shine)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="53.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.35" stroke-width="9">
    <path d="M 200 92 A 60 60 0 0 1 200 176" transform="translate(-2 -4)"/>
  </g>
  <g fill="url(#note)" filter="url(#shadow)" transform="translate(-8 -4)">
    <rect x="100" y="86" width="13" height="94" rx="3"/>
    <rect x="171" y="66" width="13" height="94" rx="3"/>
    <path d="M 100 88 L 184 64 L 184 92 L 100 116 Z"/>
    <ellipse cx="84" cy="180" rx="29" ry="21" transform="rotate(-22 84 180)"/>
    <ellipse cx="155" cy="160" rx="29" ry="21" transform="rotate(-22 155 160)"/>
  </g>
</svg>
